services:
  - type: web
    name: cinemachat-server
    env: node
    autoDeploy: true
    # yt-dlp powers /api/resolve-stream (YouTube → direct MP4 fallback for
    # blocked embeds). Every step is guarded so a missing python3/curl can
    # never fail the deploy; the server then reports RESOLVER_UNAVAILABLE (503)
    # until a binary is actually present. Multiple candidates are installed so
    # the server's probe (yt-dlp / ./yt-dlp / ./bin/yt-dlp / /usr/local/bin/
    # yt-dlp / ~/.local/bin/yt-dlp) can find one.
    buildCommand: >
      npm install && npm run build &&
      (python3 -m pip install --upgrade --user yt-dlp 2>/dev/null || python -m pip install --upgrade --user yt-dlp 2>/dev/null || pip3 install --upgrade --user yt-dlp 2>/dev/null || pip install --upgrade --user yt-dlp 2>/dev/null || true) &&
      (curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ./bin/yt-dlp && chmod +x ./bin/yt-dlp 2>/dev/null || true) &&
      (curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && chmod +x /usr/local/bin/yt-dlp 2>/dev/null || true)
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      # REQUIRED for the durable admin-account backup (used by sub-admin account
      # creation/deletion and admin password changes). Render's filesystem is
      # ephemeral and wipes db.json on every deploy, so without Firebase Admin
      # credentials the admin accounts + main admin password are NOT persisted
      # and silently reset after each redeploy.
      # Set the actual value (service-account JSON as a single-line string) in
      # Render's Dashboard -> Environment, or in a shared Environment Group.
      # Do NOT commit the secret here.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Web Push (VAPID) — required for the notifications system. The PRIVATE key
      # must never reach the client or be committed. Generate locally with:
      #   npx web-push generate-vapid-keys --json
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
