# .github/workflows/deploy.yml
# Deploys frontend to Firebase Hosting AND triggers Render backend deploy.
#
# SETUP (one-time):
#   1. Get your Render Deploy Hook URL:
#      https://dashboard.render.com → cinemachat-server → Settings → Build & Deploy → Deploy Hook
#   2. In GitHub repo: Settings → Secrets and variables → Actions
#   3. Add secret: RENDER_DEPLOY_HOOK = (the URL from step 1)
#   4. Ensure other secrets (VITE_*, FIREBASE_SERVICE_ACCOUNT) are still set.

name: Deploy to Firebase + Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}
          VITE_WHATSAPP_GROUP_LINK: ${{ secrets.VITE_WHATSAPP_GROUP_LINK }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_AGORA_APP_ID: ${{ secrets.VITE_AGORA_APP_ID }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0240212572 }}'
          channelId: live
          projectId: gen-lang-client-0240212572

      - name: Trigger Render deploy
        if: success()
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK not set — skipping Render deploy."
            echo "To enable: GitHub repo → Settings → Secrets → Add RENDER_DEPLOY_HOOK"
            exit 0
          fi
          echo "Triggering Render deploy..."
          curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo ""
          echo "Render deploy triggered."
